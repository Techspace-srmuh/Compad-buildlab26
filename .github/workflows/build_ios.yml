name: Build CompAd iOS Release (iPhone)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions web tab

jobs:
  build-ios:
    name: Build iPhone IPA & Runner Bundle
    runs-on: macos-14 # Apple Silicon macOS runner with Xcode pre-installed

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: comp_ad
        run: flutter pub get

      - name: Set up CocoaPods
        working-directory: comp_ad/ios
        run: |
          pod repo update
          pod install

      - name: Build iOS Application (Release Mode)
        working-directory: comp_ad
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Standalone .IPA for iPhone
        run: |
          mkdir -p Payload
          cp -r comp_ad/build/ios/iphoneos/Runner.app Payload/
          zip -r compad-iphone-release.ipa Payload
          zip -r compad-runner-app.zip comp_ad/build/ios/iphoneos/Runner.app

      - name: Upload iPhone IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compad-iphone-release
          path: compad-iphone-release.ipa
          retention-days: 30

      - name: Upload Runner App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compad-runner-app
          path: compad-runner-app.zip
          retention-days: 30
