name: compad
description: "A 100% offline-first campus companion with Spatial Neumorphic UI."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Local Encrypted Storage & Security
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.1
  path: ^1.9.0
  local_auth: ^2.2.0
  shared_preferences: ^2.2.3

  # UI, Icons, Typography & Neumorphism
  google_fonts: ^6.2.1
  # Markdown, Code Syntax & Utility
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  intl: ^0.19.0
  lucide_icons_flutter: ^4.0.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.2
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stitch_designs/
    - assets/icons/
